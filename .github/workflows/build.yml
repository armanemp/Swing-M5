name: Build Swing-M5

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Restore
        run: dotnet restore src/SwingM5/SwingM5.csproj
      - name: Build
        run: dotnet build src/SwingM5/SwingM5.csproj --configuration Release --no-restore
